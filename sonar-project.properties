sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/test/**,**/mocks/**,**/stubs/**

sonar.exclusions=\
  e2e/**,\
  messages/**,\
  src/lib/paraglide/**,\
  src/lib/components/ui/**,\
  src/lib/edra/**,\
  src/test/**,\
  src/mocks/**

sonar.coverage.exclusions=\
  e2e/**,\
  messages/**,\
  src/lib/paraglide/**,\
  src/lib/components/ui/**,\
  src/lib/edra/**,\
  src/test/**,\
  src/mocks/**,**/*.test.*,**/*.spec.*,**/test/**,**/mocks/**,**/stubs/**,**/*.svg.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
