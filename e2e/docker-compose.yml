services:
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
      args:
        PB_VERSION: '0.29.2'
        PB_ARCH: 'amd64'
    image: opencommunities-pocketbase:local
    ports:
      - '8090:8090'
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pb_migrations:/pb/pb_migrations
    depends_on:
      - mailpit
    networks:
      - e2e

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - e2e

  cap:
    image: tiago2/cap:latest
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY:-b622695b-1e2c-42f7-87b2-b442049c679a}
      - REDIS_URL=redis://redis:6379
    ports:
      - '3001:3000'
    depends_on:
      - redis
    volumes:
      - ./cap/data:/usr/src/app/.data
    networks:
      - e2e

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - e2e

networks:
  e2e:
    driver: bridge
