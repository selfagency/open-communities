name: E2E

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      cap:
        image: tiago2/cap:latest
        ports:
          - 3001:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Download PocketBase binary
        run: |
          PB_VERSION=0.29.2
          mkdir -p .e2e
          curl -fsSL -o .e2e/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o .e2e/pb.zip -d .e2e
          chmod +x .e2e/pocketbase

      - name: Start PocketBase
        run: nohup ./.e2e/pocketbase serve --http 127.0.0.1:8090 --dir e2e/pb_data > .e2e/pb.log 2>&1 &

      - name: Start Node preview server
        env:
          ADMIN_EMAIL: rabbis4ceasefire@gmail.com
          CAP_API_KEY: 3f1ef7a88db70e5d478eadcec833d554_WRdePoOCMkcIQUiU0qjvc5q0CF8vZMA6WxpW47BYUA
          NODE_ENV: test
          PB_TEST_ADMIN: admin@test.com
          PB_TEST_PASSWORD: i3_NL-dfzzFt5TX
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          PORT: 4173
        run: nohup node build/index.js > .e2e/server.log 2>&1 &

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E
        env:
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          MAILPIT_API: http://127.0.0.1:8025/api/v1
          PB_TEST_BASEURL: http://127.0.0.1:4173
        run: pnpm exec playwright test --config e2e/playwright.config.mjs
