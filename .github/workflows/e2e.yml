name: E2E

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      cap:
        image: tiago2/cap:latest
        ports:
          - 3001:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download PocketBase binary
        run: |
          PB_VERSION=0.29.2
          mkdir -p .e2e
          curl -fsSL -o .e2e/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o .e2e/pb.zip -d .e2e
          chmod +x .e2e/pocketbase

      - name: Start PocketBase
        run: |
          nohup ./.e2e/pocketbase serve --http 127.0.0.1:8090 --dir e2e/pb_data > .e2e/pb.log 2>&1 &
          # Wait for PocketBase to be ready
          timeout 30 bash -c 'until curl -f http://127.0.0.1:8090/api/health >/dev/null 2>&1; do sleep 1; echo "Waiting for PocketBase..."; done'
          echo "PocketBase is ready"

      - name: Bootstrap PocketBase (schema + seed data)
        run: node e2e/scripts/bootstrap.mjs
        env:
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}

      - name: Pull Docker image
        run: |
          echo "Pulling Docker image..."
          docker pull ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          echo "Image pulled successfully"

      - name: Start Docker container
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CAP_API_KEY: ${{ secrets.CAP_API_KEY }}
          NODE_ENV: test
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
          PORT: 4173
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          # Container needs to reach services (PocketBase, captcha, mailpit) running on the runner.
          # Inside a container, "localhost" refers to the container itself, so use host.docker.internal
          # and add a host mapping when running the container (see --add-host below).
          PUBLIC_API_ENDPOINT: http://host.docker.internal:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://host.docker.internal:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          SMTP_HOST: localhost
          SMTP_PORT: 1025

        run: |
          echo "Starting Docker container..."
          CONTAINER_ID=$(docker run -d \
            --add-host=host.docker.internal:host-gateway \
            --name app \
            -p 4173:4173 \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e CAP_API_KEY="$CAP_API_KEY" \
            -e NODE_ENV="$NODE_ENV" \
            -e PB_TEST_ADMIN="$PB_TEST_ADMIN" \
            -e PB_TEST_PASSWORD="$PB_TEST_PASSWORD" \
            -e PUBLIC_API_ENDPOINT="$PUBLIC_API_ENDPOINT" \
            -e PUBLIC_CAPTCHA_ENDPOINT="$PUBLIC_CAPTCHA_ENDPOINT" \
            -e PUBLIC_HOSTNAME="$PUBLIC_HOSTNAME" \
            -e SMTP_HOST="host.docker.internal" \
            -e SMTP_PORT="$SMTP_PORT" \
            -e PORT="$PORT" \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }})

          echo "Container started with ID: $CONTAINER_ID"

          # Give it a moment to start
          sleep 5

          # Check container status
          echo "=== Container status ==="
          docker ps -a

          echo "=== Initial container logs ==="
          docker logs app

          # Check if container is still running
          if ! docker ps --filter "name=app" --filter "status=running" | grep -q app; then
            echo "ERROR: Container is not running!"
            echo "=== Full container logs ==="
            docker logs app
            exit 1
          fi

          echo "Container is running successfully"

      # - name: Wait for application to be ready
      #   run: |
      #     echo "Waiting for application to be ready on http://localhost:4173..."
      #     timeout 120 bash -c 'while true; do
      #       if curl -f http://localhost:4173 >/dev/null 2>&1; then
      #         echo "Application is ready!"
      #         break
      #       else
      #         echo "Waiting for app... ($(date))"
      #         echo "=== Recent container logs ==="
      #         docker logs --tail 5 app 2>/dev/null || true
      #         sleep 5
      #       fi
      #     done'

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Run Playwright E2E
        env:
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          MAILPIT_API: http://127.0.0.1:8025/api/v1
          PB_TEST_BASEURL: http://127.0.0.1:4173
        run: pnpm exec playwright test --config e2e/playwright.config.mjs

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('e2e/test-results/**') != ''
        with:
          name: e2e-test-results
          path: e2e/test-results

      - name: Upload E2E Playwright report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('e2e/playwright-report/**') != ''
        with:
          name: e2e-playwright-report
          path: e2e/playwright-report

      - name: Cleanup
        if: always()
        run: |
          echo "=== Final container logs ==="
          docker logs app 2>/dev/null || true
          echo "=== PocketBase logs ==="
          cat .e2e/pb.log 2>/dev/null || true
          docker stop app 2>/dev/null || true
          docker rm app 2>/dev/null || true
