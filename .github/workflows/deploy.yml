name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Deploy PB hooks to PocketHost
        env:
          PHIO_USERNAME: ${{ secrets.POCKETHOST_EMAIL }}
          PHIO_PASSWORD: ${{ secrets.POCKETHOST_PASSWORD }}
          PHIO_SSH_KEY: ${{ secrets.PHIO_SSH_KEY }}
        run: |
          npm install -g phio tsx
          PHIO_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/phio-nodejs"
          mkdir -p "$PHIO_DIR"
          echo "$PHIO_SSH_KEY" > "$PHIO_DIR/phio_deploy_ed25519"
          chmod 600 "$PHIO_DIR/phio_deploy_ed25519"
          ssh-keygen -y -f "$PHIO_DIR/phio_deploy_ed25519" > "$PHIO_DIR/phio_deploy_ed25519.pub"
          phio deploy -v -e pb_schema.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push cap image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/cap.Dockerfile
          tags: ghcr.io/${{ github.repository }}-cap:latest
          push: true

      - name: Build and push libretranslate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/libretranslate.Dockerfile
          tags: ghcr.io/${{ github.repository }}-libretranslate:latest
          push: true

      - name: Promote commit image to latest
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          docker pull ghcr.io/${{ github.repository }}:$COMMIT_SHA
          docker tag ghcr.io/${{ github.repository }}:$COMMIT_SHA ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Restart Coolify service
        env:
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --request POST "https://app.coolify.io/api/v1/services/${COOLIFY_UUID}/restart" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json"
