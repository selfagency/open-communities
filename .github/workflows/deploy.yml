name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_cap:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push cap image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/cap.Dockerfile
          tags: ghcr.io/${{ github.repository }}-cap:latest
          push: true

  build_lt:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push libretranslate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/libretranslate.Dockerfile
          tags: ghcr.io/${{ github.repository }}-libretranslate:latest
          push: true

  build_app:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build or pull app image
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          IMAGE="ghcr.io/${{ github.repository }}:$SHA"
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "Image exists: $IMAGE"
          else
            echo "Building image: $IMAGE"
            docker build -f docker/Dockerfile \
              --build-arg COMMIT_SHA="$SHA" \
              --build-arg PB_API_TOKEN="${{ secrets.PB_API_TOKEN }}" \
              --build-arg PB_URL="https://api.opencommunities.info" \
              -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          docker tag "$IMAGE" ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

  pb_hooks:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Deploy PB hooks to PocketHost
        env:
          PHIO_USERNAME: ${{ secrets.POCKETHOST_EMAIL }}
          PHIO_PASSWORD: ${{ secrets.POCKETHOST_PASSWORD }}
          PHIO_SSH_KEY: ${{ secrets.PHIO_SSH_KEY }}
        run: |
          npm install -g phio tsx
          PHIO_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/phio-nodejs"
          mkdir -p "$PHIO_DIR"
          echo "$PHIO_SSH_KEY" > "$PHIO_DIR/phio_deploy_ed25519"
          chmod 600 "$PHIO_DIR/phio_deploy_ed25519"
          ssh-keygen -y -f "$PHIO_DIR/phio_deploy_ed25519" > "$PHIO_DIR/phio_deploy_ed25519.pub"
          phio deploy -v -e pb_schema.json

  deploy:
    needs:
      - build_cap
      - build_lt
      - build_app
      - pb_hooks
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      UUID: ${{ secrets.COOLIFY_UUID }}
      TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TAILSCALE_KEY }}
          tags: tag:ci

      - name: Restart Coolify service
        run: |
          curl -X GET "http://host.munchkin-mamba.ts.net:8000/api/v1/services/${{ env.UUID }}/restart?latest=true" \
            -H "Authorization: Bearer ${{ env.TOKEN }}"
