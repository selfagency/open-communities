name: Test Report

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository (default branch context)
        uses: actions/checkout@v4

      - name: Download test-results artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: test-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Debug downloaded artifacts
        run: |
          echo "=== Downloaded test-results ==="
          ls -la test-results/ || echo "No test-results directory"
          echo "=== Downloaded coverage ==="
          ls -la test-results/coverage/ || echo "No coverage directory"
          echo "=== All files ==="
          find . -type f -name "*.xml" -o -name "*.json" | grep -E "(coverage|test)" || echo "No relevant files found"

      - name: Report coverage (step summary + PR comment)
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          # point to the json summary produced by vitest
          json-summary-path: '../test-results/coverage/coverage-summary.json'
          json-final-path: '../test-results/coverage/coverage-final.json'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on: pr

      - name: Publish test report (create check run)
        uses: dorny/test-reporter@v2
        with:
          artifact: test-results
          path: './junit.xml'
          reporter: java-junit
          name: Vitest Tests
          use-actions-summary: 'true'
          fail-on-empty: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
