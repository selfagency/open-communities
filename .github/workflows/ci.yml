name: CI

on:
  pull_request:
    branches: ['main']
  workflow_run:
    workflows: ['Build']
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Build application
        run: pnpm build
        env:
          PB_API_TOKEN: ${{ secrets.PB_API_TOKEN }}
          PB_URL: https://api.opencommunities.info

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          if-no-files-found: error

      - name: Run tests (vitest) with coverage
        id: test
        continue-on-error: true
        run: |
          pnpm vitest run --coverage --coverage.enabled=true --reporter=junit --reporter=json
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CAP_API_KEY: ${{ secrets.CAP_API_KEY }}
          NODE_ENV: test
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          SMTP_HOST: localhost
          SMTP_PORT: 1025

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/**') != ''
        with:
          name: test-results
          path: test-results

      - name: Fail workflow if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Report coverage (step summary + PR comment)
        if: always() && hashFiles('test-results/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: 'test-results/coverage/coverage-summary.json'
          json-final-path: 'test-results/coverage/coverage-final.json'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on: pr

      - name: Publish test report (create check run)
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          path: 'test-results/junit.xml'
          reporter: java-junit
          name: Vitest Tests
          use-actions-summary: 'true'
          fail-on-empty: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fallow:
    name: Fallow analysis
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: fallow-rs/fallow@de03f6ffd28d2d9cc487c31afd39bbc34d0d6d3d # v2
        with:
          format: sarif
          comment: true
          review-comments: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E tests
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Start Docker Compose (PB, Mailpit, Cap, Redis)
        run: |
          docker compose -f e2e/docker-compose.yml up -d
          # Wait for PB to be healthy
          timeout 30 bash -c 'until curl -f http://localhost:8090/api/health >/dev/null 2>&1; do sleep 1; done'
          echo "All services ready"

      - name: Bootstrap PocketBase
        run: node e2e/scripts/bootstrap.mjs
        env:
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Start preview server
        run: |
          mkdir -p .e2e
          nohup node build/index.js > .e2e/app.log 2>&1 &
          timeout 30 bash -c 'until curl -f http://localhost:4173 >/dev/null 2>&1; do sleep 1; done'
          echo "App is ready"
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CAP_API_KEY: ${{ secrets.CAP_API_KEY }}
          NODE_ENV: test
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
          PORT: 4173
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          SMTP_HOST: localhost
          SMTP_PORT: 1025

      - name: Run Playwright E2E
        env:
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_API: http://localhost:8025/api/v1
          PB_TEST_BASEURL: http://localhost:4173
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
        run: pnpm exec playwright test --config e2e/playwright.config.mjs

      - name: Docker Compose logs (on failure)
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail=50

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('e2e/test-results/**') != ''
        with:
          name: e2e-test-results
          path: e2e/test-results

      - name: Upload E2E Playwright report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('e2e/playwright-report/**') != ''
        with:
          name: e2e-playwright-report
          path: e2e/playwright-report

      - name: Run accessibility checks (pa11y-ci)
        continue-on-error: true
        run: |
          npx --yes pa11y-ci@latest --urls "http://localhost:4173/ http://localhost:4173/admin http://localhost:4173/admin/congregations http://localhost:4173/admin/users http://localhost:4173/admin/approvals http://localhost:4173/admin/analytics http://localhost:4173/admin/pages http://localhost:4173/admin/settings"
