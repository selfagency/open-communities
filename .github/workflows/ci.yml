name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.x"

jobs:
  lint-and-typecheck:
    name: Build & typecheck & lint
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-build-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-build-

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-build-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate i18n messages + type check
        run: |
          pnpm paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
          pnpm svelte-kit sync
          pnpm svelte-check

      - name: Lint
        run: pnpm check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    permissions:
      checks: write
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-unit-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-unit-

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-unit-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-unit-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types (required for tsconfig resolution)
        run: pnpm svelte-kit sync

      - name: Run tests (vitest) with coverage
        id: test
        continue-on-error: true
        run: |
          pnpm vitest run --project server --coverage --coverage.enabled=true --reporter=junit --reporter=json
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CAP_API_KEY: ${{ secrets.CAP_API_KEY }}
          NODE_ENV: test
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          SMTP_HOST: localhost
          SMTP_PORT: 1025

      - name: Upload test results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('test-results/**') != ''
        with:
          name: test-results
          path: test-results

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report coverage (step summary + PR comment)
        if: always() && hashFiles('test-results/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2
        with:
          json-summary-path: "test-results/coverage/coverage-summary.json"
          json-final-path: "test-results/coverage/coverage-final.json"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on: pr

      - name: Publish test report (create check run)
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4 # v2
        with:
          path: "test-results/junit.xml"
          reporter: java-junit
          name: Vitest Tests
          use-actions-summary: "true"
          fail-on-empty: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail workflow if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Fallow analysis with coverage
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        continue-on-error: true
        uses: fallow-rs/fallow@de03f6ffd28d2d9cc487c31afd39bbc34d0d6d3d # v2
        with:
          format: sarif
          comment: true
          review-comments: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          args: --coverage test-results/coverage/coverage-final.json

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-e2e-

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-e2e-

      - name: Install all dependencies (includes @playwright/test)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps --only-shell

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build app image with cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: opencommunities-e2e
          load: true
          build-args: |
            PB_API_TOKEN=${{ secrets.PB_API_TOKEN }}
            PB_URL=https://api.opencommunities.info
            COMMIT_SHA=${{ github.sha }}

      - name: Start infra and app
        env:
          NODE_ENV: test
          PUBLIC_API_ENDPOINT: http://pocketbase:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_CAPTCHA_SITE_KEY: de02608805
          CAPTCHA_SITE_SECRET: OI1CeaaFu9cUe7yqDFqVqlG4NcPOFsPBX0iAqoH5ogQvuoKoov8w
          PUBLIC_HOSTNAME: http://localhost:3000
          SMTP_HOST: mailpit
          SMTP_PORT: "1025"
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d --build \
            pocketbase dragonfly cap libretranslate mailpit
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d app
          timeout 30 bash -c 'until curl -f http://localhost:8090/api/health >/dev/null 2>&1; do sleep 1; done'
          echo "PB ready"

      - name: Bootstrap PocketBase
        run: node docker/scripts/bootstrap.mjs
        env:
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}

      - name: Wait for app
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3000 >/dev/null 2>&1; do sleep 2; done'
          echo "App ready"

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_API: http://localhost:8025/api/v1
          PB_TEST_BASEURL: http://localhost:3000
          PB_TEST_ADMIN: ${{ secrets.PB_TEST_ADMIN }}
          PB_TEST_PASSWORD: ${{ secrets.PB_TEST_PASSWORD }}
        run: npx playwright test --config e2e/playwright.config.cjs

      - name: Upload E2E test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('e2e/test-results/**') != ''
        with:
          name: e2e-test-results
          path: e2e/test-results

      - name: Upload E2E Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('e2e/playwright-report/**') != ''
        with:
          name: e2e-playwright-report
          path: e2e/playwright-report

      - name: Find or create pa11y PR comment
        if: github.event_name == 'pull_request' && steps.pa11y.outcome == 'success' && hashFiles('.e2e/pa11y-summary.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_ID=$(gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '.[] | select(.body | startswith("## ♿ Accessibility Report")) | .id' | head -1)
          BODY=$(cat .e2e/pa11y-summary.md)
          if [ -n "$COMMENT_ID" ]; then
            gh api "/repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY" > /dev/null
          else
            gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -X POST -f body="$BODY" > /dev/null
          fi

      - name: Docker Compose logs (on failure)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs --tail=50

      - name: Push app image to GHCR (main only)
        if: always() && github.event_name == 'push'
        run: |
          docker tag opencommunities-e2e ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v
