name: CI

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed

jobs:
  test:
    name: Run tests and upload artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install

      - name: Run tests (vitest) with coverage
        id: test
        continue-on-error: true
        run: pnpm test -- --coverage.enabled true

      - name: Collect coverage folder (if present)
        run: |
          if [ -d coverage ]; then echo 'coverage found'; else echo 'no coverage dir'; fi

      - name: Collect test result XML files
        run: |
          mkdir -p test-results || true
          # try to find common junit/xml files produced by vitest or reporters and copy them
          find . -maxdepth 4 -type f \( -iname "*junit*.xml" -o -iname "*test-results*.xml" -o -iname "*vitest*.xml" -o -iname "*.xml" \) -print -exec cp {} test-results/ \; || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Fail workflow if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
