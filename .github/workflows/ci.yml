name: CI

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed

jobs:
  test:
    name: Run tests and upload artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm (via Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Build application
        run: pnpm build
        env:
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Run tests (vitest) with coverage
        id: test
        continue-on-error: true
        run: |
          pnpm test -- --coverage --reporter=default --reporter=junit --reporter=json
        env:
          ADMIN_EMAIL: rabbis4ceasefire@gmail.com
          CAP_API_KEY: 3f1ef7a88db70e5d478eadcec833d554_WRdePoOCMkcIQUiU0qjvc5q0CF8vZMA6WxpW47BYUA
          NODE_ENV: test
          PB_TEST_ADMIN: admin@test.com
          PB_TEST_PASSWORD: i3_NL-dfzzFt5TX
          PUBLIC_API_ENDPOINT: http://localhost:8090
          PUBLIC_CAPTCHA_ENDPOINT: http://localhost:3001
          PUBLIC_HOSTNAME: http://localhost:4173
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SMTP_HOST: localhost
          SMTP_PORT: 1025

      # - name: Debug coverage and test results
      #   run: |
      #     echo "=== Coverage directory ==="
      #     ls -la coverage/ || echo "No coverage directory"
      #     echo "=== Test results directory ==="
      #     ls -la test-results/ || echo "No test-results directory"
      #     echo "=== All XML files ==="
      #     find . -name "*.xml" -type f | head -10

      # - name: Ensure test results directory exists
      #   run: |
      #     mkdir -p test-results
      #     # Copy any XML files from root or common locations
      #     find . -maxdepth 2 -name "junit*.xml" -type f -exec cp {} test-results/ \;
      #     find . -maxdepth 2 -name "*test*.xml" -type f -exec cp {} test-results/ \;
      #     ls -la test-results/ || echo "test-results still empty"

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/**') != ''
        with:
          name: test-results
          path: test-results

      - name: Fail workflow if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
