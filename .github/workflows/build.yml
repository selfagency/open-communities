name: Build and Push

on:
  push:
    branches: ['main']
  # workflow_run:
  #   workflows: ['CI']
  #   types:
  #     - completed

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Build and push Docker images
        uses: iloveitaly/github-action-nixpacks@main
        with:
          cache: true
          push: true
          env: |
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}, CAPTCHA_SITE_SECRET=${{ secrets.CAPTCHA_SITE_SECRET }}, MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}, PUBLIC_CAPTCHA_SITE_KEY=${{ vars.PUBLIC_CAPTCHA_SITE_KEY }}, PUBLIC_API_ENDPOINT=${{ vars.PUBLIC_API_ENDPOINT }}, PUBLIC_HOSTNAME=${{ vars.PUBLIC_HOSTNAME }}, PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}, SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
