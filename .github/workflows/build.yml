name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONTAINER_TOKEN }}

      - name: Build and push Docker images
        uses: iloveitaly/github-action-nixpacks@main
        with:
          cache: true
          push: true
          env: |
            CAPTCHA_SITE_SECRET=${{ secrets.CAPTCHA_SITE_SECRET }}, PUBLIC_CAPTCHA_SITE_KEY=${{ env.PUBLIC_CAPTCHA_SITE_KEY }}, PUBLIC_API_ENDPOINT=${{ env.PUBLIC_API_ENDPOINT }}, PUBLIC_HOSTNAME=${{ env.PUBLIC_HOSTNAME }}, PUBLIC_SENTRY_DSN=${{ env.PUBLIC_SENTRY_DSN }}, SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
