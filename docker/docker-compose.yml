# Coolify Production Docker Compose
#
# Used directly by Coolify (Docker Compose build pack) for production
# deployment of the full stack: app + dragonfly + cap + libretranslate.
#
# Override with docker-compose.dev.yml for local development:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
#
# NOTE:
#   - No custom networks (Coolify creates its own bridge network)
#   - No port mappings (Traefik handles routing)
#   - No profiles (Coolify does not support Compose profiles)
#   - PocketBase runs on a dedicated remote server, not in this stack

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.26.2
    command:
      - '--maxmemory=1gb'
      - '--proactor_threads=4'
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    restart: unless-stopped

  cap:
    build:
      context: .
      dockerfile: cap.Dockerfile
    depends_on:
      dragonfly:
        condition: service_started
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY:-b622695b-1e2c-42f7-87b2-b442049c679a}
      - REDIS_URL=redis://dragonfly:6379
    volumes:
      - cap_data:/usr/src/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  libretranslate:
    build:
      context: .
      dockerfile: libretranslate.Dockerfile
    environment:
      LT_LOAD_ONLY: en,es,fr,de,he,pl,pt,hu,nl,ru,uk
      LT_API_KEYS: 'true'
      LT_API_KEYS_DB_PATH: /app/db/api_keys.db
    volumes:
      - libretranslate_data:/app/db
    restart: unless-stopped

  app:
    image: opencommunities-e2e
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      dragonfly:
        condition: service_started
      cap:
        condition: service_started
      libretranslate:
        condition: service_started
    environment:
      CAPTCHA_INTERNAL_ENDPOINT: http://cap:3000
      PUBLIC_CAPTCHA_ENDPOINT: ${PUBLIC_CAPTCHA_ENDPOINT:-http://cap:3000}
      LT_API_URL: http://libretranslate:5000
      PUBLIC_API_ENDPOINT: ${PUBLIC_API_ENDPOINT}
      PUBLIC_CAPTCHA_SITE_KEY: ${PUBLIC_CAPTCHA_SITE_KEY}
      CAPTCHA_SITE_SECRET: ${CAPTCHA_SITE_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY}
      PUBLIC_POSTHOG_HOST: ${PUBLIC_POSTHOG_HOST}
    restart: unless-stopped

volumes:
  dragonfly_data:
  cap_data:
  libretranslate_data:
